name: 🐛 Bug report
description: Report something that isn't working
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug!
        ⚠️ **Never paste real credentials, secrets, or private keys.**
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `npm run dev`
        2. POST /api/payments with ...
        3. See error
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options:
        - Mock mode (DANA_MOCK_MODE=true)
        - Sandbox (DANA_MOCK_MODE=false)
        - Production
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node version
      placeholder: "e.g. 20.x / 24.x"
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Redact any secrets before pasting.
      render: shell
