  <text x="210" y="478" font-size="12" fill="#94a3b8" text-anchor="middle">/api/events</text>

  <!-- Backend -->
  <rect x="450" y="80" width="320" height="440" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
  <g transform="translate(588,104) scale(1.1666666666666667)" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4m0 3a3 3 0 0 1 3 -3h12a3 3 0 0 1 3 3v2a3 3 0 0 1 -3 3h-12a3 3 0 0 1 -3 -3z"/><path d="M3 12m0 3a3 3 0 0 1 3 -3h12a3 3 0 0 1 3 3v2a3 3 0 0 1 -3 3h-12a3 3 0 0 1 -3 -3z"/><path d="M7 8l0 .01"/><path d="M7 16l0 .01"/></g>
