<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" font-family="Inter, -apple-system, 'Segoe UI', sans-serif">
  <rect width="1200" height="620" fill="#f8fafc"/>

  <!-- Browser / Frontend -->
  <rect x="60" y="80" width="300" height="440" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="210" y="120" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">🖥  Frontend</text>
  <text x="210" y="144" font-size="12" fill="#64748b" text-anchor="middle">React 19 · Vite · Tailwind v4</text>
  <line x1="80" y1="160" x2="340" y2="160" stroke="#f1f5f9"/>
  <g font-size="13" fill="#334155">
    <text x="90" y="196">📊  Dashboard</text>
    <text x="90" y="232">➕  Create Payment</text>
    <text x="90" y="268">📋  Transactions</text>
    <text x="90" y="304">📢  Webhook Tester</text>
  </g>
  <rect x="90" y="340" width="240" height="150" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-dasharray="5 4"/>
  <text x="210" y="400" font-size="12" fill="#64748b" text-anchor="middle">Live updates via</text>
  <text x="210" y="424" font-size="14" fill="#118eea" text-anchor="middle" font-weight="700">Server-Sent Events</text>
  <text x="210" y="450" font-size="12" fill="#94a3b8" text-anchor="middle">/api/events</text>

  <!-- Backend -->
  <rect x="450" y="80" width="320" height="440" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="610" y="120" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">⚙️  Backend (Express)</text>
  <text x="610" y="144" font-size="12" fill="#64748b" text-anchor="middle">REST API · SNAP signing</text>
  <line x1="470" y1="160" x2="750" y2="160" stroke="#f1f5f9"/>
  <g font-size="12" fill="#334155" font-family="monospace">
    <text x="470" y="192">POST /api/payments</text>
    <text x="470" y="216">POST /:ref/query · /cancel</text>
    <text x="470" y="240">POST /api/webhooks/dana</text>
    <text x="470" y="264">GET  /api/payments/stats</text>
    <text x="470" y="288">GET  /api/events (SSE)</text>
  </g>
  <rect x="470" y="308" width="280" height="192" rx="12" fill="#eef4ff" stroke="#bcd0ff"/>
  <text x="610" y="338" font-size="13" fill="#0957a8" text-anchor="middle" font-weight="700">🔐 SNAP Signature Layer</text>
  <text x="490" y="368" font-size="12" fill="#334155">• HMAC-SHA512 access-token</text>
  <text x="490" y="392" font-size="12" fill="#334155">• RSA-SHA256 request signing</text>
  <text x="490" y="416" font-size="12" fill="#334155">• Webhook verify (RSA)</text>
  <text x="490" y="440" font-size="12" fill="#334155">• Mock mode (no network)</text>
  <text x="490" y="466" font-size="12" fill="#64748b">• In-memory store + event bus</text>

  <!-- DANA -->
  <rect x="870" y="80" width="270" height="440" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="945" y="104" width="120" height="120" rx="20" fill="#118eea" opacity="0.12"/>
  <text x="1005" y="186" font-size="48" text-anchor="middle">🇮🇩</text>
  <text x="1005" y="264" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">DANA Business API</text>
  <text x="1005" y="288" font-size="12" fill="#64748b" text-anchor="middle">SNAP · QRIS MPM</text>
  <line x1="890" y1="304" x2="1120" y2="304" stroke="#f1f5f9"/>
  <g font-size="12" fill="#334155" font-family="monospace">
    <text x="890" y="336">/authorization/v1.0/</text>
    <text x="900" y="356">access-token/b2b</text>
    <text x="890" y="386">/v1.0/qr/qr-mpm-generate</text>
    <text x="890" y="410">/v1.0/qr/qr-mpm-query</text>
    <text x="890" y="434">/v1.0/qr/qr-mpm-cancel</text>
  </g>
  <text x="1005" y="480" font-size="11" fill="#94a3b8" text-anchor="middle">api-sandbox.dana.id</text>
  <text x="1005" y="498" font-size="11" fill="#94a3b8" text-anchor="middle">api.dana.id (prod)</text>

  <!-- arrows -->
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <line x1="360" y1="240" x2="446" y2="240" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="446" y1="290" x2="360" y2="290" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>
  <text x="403" y="230" font-size="11" fill="#64748b" text-anchor="middle">fetch</text>
  <text x="403" y="308" font-size="11" fill="#64748b" text-anchor="middle">JSON / SSE</text>

  <line x1="770" y1="240" x2="866" y2="240" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="866" y1="290" x2="770" y2="290" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>
  <text x="818" y="230" font-size="11" fill="#64748b" text-anchor="middle">signed</text>
  <text x="818" y="308" font-size="11" fill="#64748b" text-anchor="middle">webhook</text>

  <text x="600" y="570" font-size="12" fill="#94a3b8" text-anchor="middle">Express backend proxies DANA; frontend talks only to the backend via /api</text>
</svg>
