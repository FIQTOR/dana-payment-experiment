  <text x="610" y="172" font-size="12" fill="#64748b" text-anchor="middle">REST API · SNAP signing</text>
  <line x1="470" y1="188" x2="750" y2="188" stroke="#f1f5f9"/>
  <text x="470" y="216" font-size="12" fill="#334155" font-family="monospace">POST /api/payments</text>
  <text x="470" y="240" font-size="12" fill="#334155" font-family="monospace">POST /:ref/query · /cancel · /refund</text>
  <text x="470" y="264" font-size="12" fill="#334155" font-family="monospace">POST /api/disbursements</text>
  <text x="470" y="288" font-size="12" fill="#334155" font-family="monospace">POST /api/webhooks/dana</text>
  <text x="470" y="312" font-size="12" fill="#334155" font-family="monospace">GET  /api/events (SSE)</text>
  <rect x="470" y="332" width="280" height="168" rx="12" fill="#eef4ff" stroke="#bcd0ff"/>
  <g transform="translate(490,350) scale(0.75)" fill="none" stroke="#0957a8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13a2 2 0 0 1 2 -2h10a2 2 0 0 1 2 2v6a2 2 0 0 1 -2 2h-10a2 2 0 0 1 -2 -2z"/><path d="M11 16a1 1 0 1 0 2 0a1 1 0 0 0 -2 0"/><path d="M8 11v-4a4 4 0 1 1 8 0v4"/></g>
  <text x="516" y="364" font-size="13" fill="#0957a8" font-weight="700">SNAP Signature Layer</text>
  <text x="490" y="392" font-size="12" fill="#334155">• HMAC-SHA512 access-token</text>
  <text x="490" y="416" font-size="12" fill="#334155">• RSA-SHA256 request signing</text>
  <text x="490" y="440" font-size="12" fill="#334155">• Webhook verify (RSA)</text>
  <text x="490" y="464" font-size="12" fill="#334155">• Mock mode (no network)</text>
  <text x="490" y="488" font-size="12" fill="#64748b">• Memory or MySQL (Sequelize)</text>

