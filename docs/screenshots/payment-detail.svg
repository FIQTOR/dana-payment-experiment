    <rect x="662" y="234" width="10" height="10"/><rect x="686" y="234" width="16" height="16"/><rect x="716" y="238" width="18" height="18"/>
    <rect x="736" y="206" width="20" height="20"/><rect x="740" y="230" width="12" height="12"/><rect x="760" y="216" width="10" height="10"/>
    <rect x="662" y="262" width="16" height="16"/><rect x="690" y="266" width="12" height="12"/><rect x="716" y="270" width="14" height="14"/>
    <rect x="742" y="262" width="10" height="10"/><rect x="758" y="252" width="14" height="14"/>
    <rect x="662" y="292" width="18" height="18"/><rect x="694" y="296" width="14" height="14"/><rect x="722" y="292" width="12" height="12"/>
    <rect x="746" y="300" width="16" height="16"/><rect x="770" y="292" width="10" height="10"/>
    <rect x="740" y="316" width="20" height="20"/><rect x="662" y="318" width="12" height="12"/><rect x="690" y="320" width="16" height="16"/>
